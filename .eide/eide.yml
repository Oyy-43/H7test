version: "4.1"
name: H7test
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Core
  - Drivers
  - User_Files
  - Middlewares
  - USB_DEVICE
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32h723xx.s
    - path: STM32H723XG_FLASH.ld
    - path: readme.md
    - path: Makefile
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 3aa903d89f6f345f1783c50ce60dea69
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_PWR_LDO_SUPPLY
        - USE_HAL_DRIVER
        - STM32H723xx
        - configCHECK_FOR_STACK_OVERFLOW
      incList:
        - Core/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc
        - Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Drivers/CMSIS/RTOS2/Include
        - User_Files/App/Inc
        - User_Files/Algorithm/Inc
        - User_Files/Bsp/Inc
        - User_Files/Drv/Inc
        - Middlewares/ST/ARM/DSP/Inc
        - Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
        - USB_DEVICE/App
        - USB_DEVICE/Target
        - User_Files/3_App/TimerTask_configandCallback
        - User_Files/3_App/Tele_task
        - User_Files/3_App/Arm_Control
        - User_Files/3_App/Lift_Control
        - User_Files/3_App/communication
        - User_Files/3_App/Chassis
        - User_Files/3_App/Buzzer_Music
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M7
        floatingPointHardware: double
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++17
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nosys.specs --specs=nano.specs
            output-debug-info: enable
          linker:
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32H723XG_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32H723VG
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 5000
    uploader: JLink
